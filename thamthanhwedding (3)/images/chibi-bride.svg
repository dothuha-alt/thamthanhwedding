    <circle cx="200" cy="372" r="17" fill="#fff" stroke="#e6e2d6" stroke-width="2"/>
    <circle cx="200" cy="396" r="14" fill="#fff" stroke="#e6e2d6" stroke-width="2"/>
    <circle cx="178" cy="384" r="4" fill="#f4d98a"/>
    <circle cx="222" cy="384" r="4" fill="#f4d98a"/>
    <circle cx="200" cy="372" r="5" fill="#f4d98a"/>
    <circle cx="200" cy="396" r="4" fill="#f4d98a"/>
    <!-- orchid trail -->
