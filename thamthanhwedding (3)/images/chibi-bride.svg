  <ellipse cx="242" cy="200" rx="14" ry="16" fill="#2a1d18"/>
  <circle cx="163" cy="193" r="5.5" fill="#fff"/>
  <circle cx="247" cy="193" r="5.5" fill="#fff"/>
  <circle cx="153" cy="207" r="2.4" fill="#fff"/>
  <circle cx="237" cy="207" r="2.4" fill="#fff"/>
  <path d="M142 190 Q156 180 174 186" stroke="#1a1210" stroke-width="4" fill="none" stroke-linecap="round"/>
