  <ellipse cx="298" cy="206" rx="11" ry="16" fill="#f6cfb9"/>
  <circle cx="102" cy="226" r="5" fill="#fbfbfb" stroke="#d7d7df"/>
  <circle cx="298" cy="226" r="5" fill="#fbfbfb" stroke="#d7d7df"/>
